<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2倍ウォッチ(PSA10) | ポケモンカード相場トラッカー</title>
<style>
  :root{
    --bg: #101114; --bg-panel: #17181d; --line: #2a2c33;
    --text: #e8e6df; --text-dim: #8b8d97;
    --gold: #d4af37; --holo1: #7dd8c6; --holo2: #b892e8;
    --up: #6fcf97; --tag-overseas: #6fa8dc; --tag-japan: #e07a5f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  header{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .eyebrow{font-size:12px;letter-spacing:0.12em;color:var(--holo1);text-transform:uppercase;font-weight:600;margin-bottom:10px;}
  h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(26px,5vw,38px);margin:0 0 10px;
    background:linear-gradient(120deg,var(--gold),var(--holo1) 60%,var(--holo2));
    -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0.02em;
  }
  .sub{color:var(--text-dim);font-size:14px;max-width:64ch;}
  .status{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-dim);}
  .status-badge{padding:5px 12px;border-radius:999px;border:1px solid var(--line);}
  .status-badge.warn{border-color:var(--gold);color:var(--gold);}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-btn{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;}
  .filter-btn.active{border-color:var(--holo1);color:var(--holo1);}
  .toolbar-right{display:flex;gap:8px;align-items:center;}
  select#archive-select{
    background:var(--bg-panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12px;
  }
  .csv-btn{
    font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg-panel);color:var(--text-dim);cursor:pointer;
  }
  .csv-btn:hover{color:var(--holo1);border-color:var(--holo1);}

  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);padding:0 10px 10px;border-bottom:1px solid var(--line);}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:var(--bg-panel);}
  td{padding:14px 10px;font-size:14px;vertical-align:top;}
  .rank{font-family:"SF Mono","Menlo",monospace;color:var(--text-dim);width:36px;}
  tr:nth-child(1) .rank{color:var(--gold);font-weight:700;}
  .char-btn{background:none;border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;}
  .char{font-weight:600;color:var(--text);text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;}
  .char-btn:hover .char{color:var(--holo1);text-decoration-color:var(--holo1);}
  .card-name{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .checked-date{color:var(--text-dim);font-size:10px;margin-top:2px;}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;border:1px solid currentColor;}
  .tag.overseas{color:var(--tag-overseas);}
  .tag.japan{color:var(--tag-japan);}
  .trend-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:4px;margin-left:6px;font-weight:600;}
  .trend-tag.sustained{background:rgba(111,207,151,0.15);color:var(--up);}
  .trend-tag.spike{background:rgba(224,122,95,0.15);color:var(--tag-japan);}
  .trend-tag.mixed{background:rgba(139,141,151,0.15);color:var(--text-dim);}
  .price{font-family:"SF Mono","Menlo",monospace;text-align:right;white-space:nowrap;}
  .change{font-family:"SF Mono","Menlo",monospace;text-align:right;font-weight:700;color:var(--up);white-space:nowrap;}
  .chart-cell{width:110px;}
  tr:nth-child(1){background:linear-gradient(90deg, rgba(212,175,55,0.08), rgba(125,216,198,0.06));}
  .empty{padding:60px 20px;text-align:center;color:var(--text-dim);border:1px dashed var(--line);border-radius:12px;}
  footer{margin-top:40px;font-size:12px;color:var(--text-dim);text-align:center;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
    align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;
    max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);
    font-size:20px;cursor:pointer;line-height:1;
  }
  .modal-close:hover{color:var(--text);}
  .modal-image{width:100%;max-width:220px;display:block;margin:0 auto 16px;border-radius:8px;}
  .modal-image-placeholder{
    width:100%;max-width:220px;height:220px;margin:0 auto 16px;border-radius:8px;
    border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:12px;text-align:center;padding:10px;
  }
  .modal h2{font-size:18px;margin:0 0 4px;}
  .modal .modal-sub{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  .modal-chart{width:100%;height:160px;margin-bottom:16px;}
  .modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;}
  .modal-stat{background:var(--bg);border-radius:8px;padding:10px;}
  .modal-stat .label{color:var(--text-dim);font-size:11px;margin-bottom:4px;}
  .modal-stat .value{font-weight:700;font-family:"SF Mono","Menlo",monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Personal Price Tracker ・ PSA10基準</div>
    <h1>2倍ウォッチ(PSA10)</h1>
    <p class="sub">対象300キャラクターについて、上位25枚(3日周期で一巡)のPSA10(鑑定満点)価格を追跡し、3ヶ月前と比べて2倍(+100%)以上・上昇額+5000円以上になったカードを抽出しています。名前をクリックすると詳細が見られます。</p>
    <div class="status" id="status"></div>
  </header>

  <div class="toolbar">
    <div class="filters" id="filters" style="display:none">
      <button class="filter-btn active" data-market="all">すべて</button>
      <button class="filter-btn" data-market="overseas">海外のみ</button>
      <button class="filter-btn" data-market="japan">日本のみ</button>
    </div>
    <div class="toolbar-right">
      <button class="csv-btn" id="csv-btn" style="display:none">CSVで書き出す</button>
      <select id="archive-select" style="display:none"></select>
    </div>
  </div>

  <div id="content"><div class="empty">読み込み中です…</div></div>

  <footer>Data source: PokemonPriceTracker API(PSA10鑑定価格) ・ 個人利用のためのツールです</footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let allCards = [];
let currentFilter = 'all';

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function trendLabel(trend){
  if(trend === 'sustained') return {text:'継続上昇', cls:'sustained'};
  if(trend === 'spike') return {text:'直近急騰', cls:'spike'};
  return {text:'変動あり', cls:'mixed'};
}

function buildChartSvg(points, w, h){
  if(!points || points.length < 2) return '';
  const pad = 4;
  const prices = points.map(p => p.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.price - min) / range) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up = points[points.length-1].price >= points[0].price;
  const color = up ? '#6fcf97' : '#e07a5f';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

function sparkline(points){
  return buildChartSvg(points, 100, 32);
}

function openModal(card){
  const body = document.getElementById('modal-body');
  const trend = trendLabel(card.trend);
  const imageHtml = card.image_url
    ? `<img class="modal-image" src="${escapeHtml(card.image_url)}" alt="${escapeHtml(card.card_name || '')}">`
    : `<div class="modal-image-placeholder">画像は取得できませんでした</div>`;

  body.innerHTML = `
    ${imageHtml}
    <h2>${escapeHtml(card.character)}</h2>
    <div class="modal-sub">${escapeHtml(card.card_name || '')} ${escapeHtml(card.set_name ? '・'+card.set_name : '')} ・ PSA10</div>
    <div class="modal-chart">${buildChartSvg(card.chart, 430, 160)}</div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="label">市場</div><div class="value">${escapeHtml(card.market)}</div></div>
      <div class="modal-stat"><div class="label">傾向</div><div class="value">${trend.text}</div></div>
      <div class="modal-stat"><div class="label">3ヶ月前(${escapeHtml(card.old_date || '')})</div><div class="value">$${card.old_price.toFixed(2)}</div></div>
      <div class="modal-stat"><div class="label">現在</div><div class="value">$${card.new_price.toFixed(2)}</div></div>
      <div class="modal-stat"><div class="label">変化率</div><div class="value">+${card.change_pct.toFixed(1)}%</div></div>
      <div class="modal-stat"><div class="label">上昇額(円換算)</div><div class="value">+¥${card.yen_increase.toLocaleString()}</div></div>
    </div>
    ${card.checked_date ? `<div class="checked-date" style="margin-top:12px;">最終確認日: ${escapeHtml(card.checked_date)}</div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function exportCsv(){
  const cards = currentFilter === 'all' ? allCards : allCards.filter(c => c.market_key === currentFilter);
  const header = ['キャラクター','カード名','セット','市場','3ヶ月前価格($)','現在価格($)','変化率(%)','上昇額(円)','傾向','最終確認日'];
  const rows = cards.map(c => [
    c.character, c.card_name || '', c.set_name || '', c.market,
    c.old_price, c.new_price, c.change_pct, c.yen_increase,
    trendLabel(c.trend).text, c.checked_date || ''
  ]);
  const csvLines = [header, ...rows].map(row =>
    row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
  );
  const csv = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `2倍ウォッチ_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function render(){
  const contentEl = document.getElementById('content');
  const cards = currentFilter === 'all' ? allCards : allCards.filter(c => c.market_key === currentFilter);

  if(cards.length === 0){
    contentEl.innerHTML = '<div class="empty">条件に合うカードはまだありません。データが更新されるとここに表示されます。</div>';
    return;
  }

  const rows = cards.map((c, i) => {
    const tagClass = c.market_key === 'japan' ? 'japan' : 'overseas';
    const trend = trendLabel(c.trend);
    return `
      <tr>
        <td class="rank">${i+1}</td>
        <td>
          <button class="char-btn" data-index="${i}">
            <div class="char">${escapeHtml(c.character)}</div>
          </button>
          <div class="card-name">${escapeHtml(c.card_name || '')} ${escapeHtml(c.set_name ? '・'+c.set_name : '')} ・ PSA10</div>
          <span class="tag ${tagClass}">${escapeHtml(c.market)}</span>
          <span class="trend-tag ${trend.cls}">${trend.text}</span>
          ${c.checked_date ? `<div class="checked-date">確認日: ${escapeHtml(c.checked_date)}</div>` : ''}
        </td>
        <td class="chart-cell">${sparkline(c.chart)}</td>
        <td class="price">$${c.old_price.toFixed(2)} → $${c.new_price.toFixed(2)}</td>
        <td class="change">+${c.change_pct.toFixed(1)}%<div class="card-name">+¥${c.yen_increase.toLocaleString()}</div></td>
      </tr>
    `;
  }).join('');

  contentEl.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>キャラクター / カード</th><th>推移</th><th style="text-align:right">価格(PSA10)</th><th style="text-align:right">変化率</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  contentEl.querySelectorAll('.char-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openModal(cards[parseInt(btn.dataset.index, 10)]);
    });
  });
}

async function loadSummary(path){
  const res = await fetch(path, {cache: 'no-store'});
  if(!res.ok) throw new Error('no data');
  return res.json();
}

function applySummary(summary){
  const statusEl = document.getElementById('status');
  const filtersEl = document.getElementById('filters');
  const csvBtn = document.getElementById('csv-btn');

  let statusHtml = `<span class="status-badge">表示日: ${summary.generated_at}</span>
    <span class="status-badge">対象: ${summary.checked_characters} / ${summary.total_characters} キャラ(今日分)</span>
    <span class="status-badge">条件: 3ヶ月で+${summary.min_change_pct}%以上 かつ +¥${summary.min_yen_increase.toLocaleString()}以上</span>
    <span class="status-badge">為替: $1=¥${summary.usd_jpy_rate}</span>`;
  if(summary.stopped_early){
    statusHtml += `<span class="status-badge warn">この日はAPIの上限により途中まで</span>`;
  }
  if(summary.psa10_data_found === false){
    statusHtml += `<span class="status-badge warn">PSA10データが取得できていません(要確認)</span>`;
  }
  statusEl.innerHTML = statusHtml;

  allCards = summary.cards || [];
  filtersEl.style.display = allCards.length > 0 ? 'flex' : 'none';
  csvBtn.style.display = allCards.length > 0 ? 'inline-block' : 'none';
  render();
}

async function setupArchive(){
  const selectEl = document.getElementById('archive-select');
  try{
    const res = await fetch('data/archive/index.json', {cache: 'no-store'});
    if(!res.ok) return;
    const dates = await res.json();
    if(!dates || dates.length === 0) return;
    dates.sort().reverse();
    selectEl.innerHTML = dates.map((d, i) => `<option value="${d}">${d}${i===0 ? '(最新)' : ''}</option>`).join('');
    selectEl.style.display = 'inline-block';
    selectEl.addEventListener('change', async () => {
      try{
        const summary = await loadSummary(`data/archive/${selectEl.value}.json`);
        applySummary(summary);
      }catch(e){ /* ignore */ }
    });
  }catch(e){ /* アーカイブが無くても致命的ではない */ }
}

async function main(){
  const contentEl = document.getElementById('content');
  let summary;
  try{
    summary = await loadSummary('data/summary.json');
  }catch(e){
    contentEl.innerHTML = '<div class="empty">まだデータがありません。毎日の自動取得が始まると、ここに表示されます。</div>';
    return;
  }
  applySummary(summary);
  setupArchive();
}

document.getElementById('filters').addEventListener('click', (e) => {
  if(!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.market;
  render();
});

document.getElementById('csv-btn').addEventListener('click', exportCsv);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') closeModal();
});

main();
</script>
</body>
</html>
